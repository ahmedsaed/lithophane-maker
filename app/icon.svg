<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A lit lithophane cube: dark frame, warm glowing panels on the three visible faces. -->
  <!-- Faces (frame colour) -->
  <polygon points="32,5 57,19 32,33 7,19" fill="#4b5262"/>
  <polygon points="7,19 32,33 32,61 7,47" fill="#3a404d"/>
  <polygon points="32,33 57,19 57,47 32,61" fill="#2e333e"/>
  <!-- Glowing panel windows, inset from each face -->
  <polygon points="32,11.5 46,19 32,26.5 18,19" fill="#ffe1a8"/>
  <polygon points="12,25 27.5,33.8 27.5,53 12,44.2" fill="#f7b45a"/>
  <polygon points="36.5,33.8 52,25 52,44.2 36.5,53" fill="#e8913a"/>
  <!-- Frame edges -->
  <g fill="none" stroke="#1d2129" stroke-width="2" stroke-linejoin="round">
    <polygon points="32,5 57,19 57,47 32,61 7,47 7,19"/>
    <polyline points="7,19 32,33 57,19"/>
    <line x1="32" y1="33" x2="32" y2="61"/>
  </g>
</svg>
